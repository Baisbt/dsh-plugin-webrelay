# dsh-webrelay 站点配置（默认模板）。
# 首次运行会复制到 $DSH_HOME/webrelay/sites.yml（Windows 默认 %USERPROFILE%\.dsh\webrelay\sites.yml）。
# 用户应编辑 $DSH_HOME/webrelay/sites.yml；本文件仅作出厂默认，随插件更新。
#
# 字段说明：
#   name          展示名
#   home          入口地址（内置浏览器默认打开）
#   match         站点识别域名列表（也用于限制 relay 代理的目标，防开放代理）
#   experimental  true = 实验性适配（未端到端实测）
#   adapter       DOM 适配器：全部为"候选选择器链"，按序取第一个命中的元素
#     input                 对话输入框（textarea 或 contenteditable）
#     inputContentEditable  输入框是否 contenteditable（true 时用 textContent + input 事件写入）
#     send                  发送按钮候选（可空数组 → 用 Enter 键发送）
#     sendMode              enter | click | enter-then-click
#     replies               助手回复节点候选（抓取最后一个可见节点文本）
#     generating            生成中标记候选（出现表示仍在输出；全部消失且回复数稳定 → 视为完成）
#
# 说明：附件上传**不由本插件承担**。当提示词可能需要文件时，插件只在弹窗里提示
# 一句「本次提示词可能需要附件」并点明大致需要哪类材料；实际上传请在外部浏览器里
# 用页面自带的附件按钮完成。因此这里没有附件控件相关配置。

sites:
  deepseek:
    name: DeepSeek
    home: https://chat.deepseek.com/
    match: [chat.deepseek.com]
    experimental: false
    adapter:
      input: ['textarea#chat-input', 'textarea[placeholder]', 'textarea']
      inputContentEditable: false
      send: []
      sendMode: enter
      replies: ['.ds-markdown', '[class*="message-content"]', '[class*="markdown"]']
      generating: ['[class*="stop-button"]', '[class*="stop"]', '[class*="generating"]']

  chatgpt:
    name: ChatGPT
    home: https://chatgpt.com/
    match: [chatgpt.com, chat.openai.com]
    experimental: false
    adapter:
      input: ['#prompt-textarea', 'div[contenteditable="true"]', 'textarea[data-id]']
      inputContentEditable: true
      send: ['[data-testid="send-button"]', 'button[aria-label*="Send"]', 'button[aria-label*="发送"]']
      sendMode: enter-then-click
      replies: ['[data-message-author-role="assistant"]', '.markdown']
      generating: ['[data-testid="stop-button"]', 'button[aria-label*="Stop"]']

  doubao:
    name: 豆包
    home: https://www.doubao.com/chat/
    match: [doubao.com, www.doubao.com]
    experimental: true
    adapter:
      input: ['[data-testid="chat_input_input"]', 'div[contenteditable="true"]', 'textarea']
      inputContentEditable: true
      send: ['[data-testid="chat_input_send_button"]', 'button[aria-label*="发送"]']
      sendMode: enter-then-click
      replies: ['[data-testid="receive_message"]', '[class*="message__content"]', '[class*="markdown"]']
      generating: ['[data-testid="stop_button"]', '[class*="stop"]']

  qianwen:
    name: 通义千问
    home: https://www.tongyi.com/
    match: [tongyi.com, www.tongyi.com, tongyi.aliyun.com]
    experimental: true
    adapter:
      input: ['textarea[placeholder*="千问"]', '#chat-input', 'textarea', 'div[contenteditable="true"]']
      inputContentEditable: false
      send: ['[class*="send-button"]', 'button[aria-label*="发送"]']
      sendMode: enter-then-click
      replies: ['[class*="answer-item"]', '[class*="tongyi-markdown"]', '[class*="markdown"]']
      generating: ['[class*="stop"]', '[class*="pause"]']

  gemini:
    name: Gemini
    home: https://gemini.google.com/app
    match: [gemini.google.com]
    experimental: true
    adapter:
      input: ['div.ql-editor[contenteditable="true"]', 'rich-textarea div[contenteditable="true"]', 'div[contenteditable="true"]']
      inputContentEditable: true
      send: ['button[aria-label*="Send"]', 'button[aria-label*="发送"]', 'button.send-button']
      sendMode: click
      replies: ['model-response', 'message-content', '[class*="markdown"]']
      generating: ['button[aria-label*="Stop"]', '[class*="loading"]']

# relay 反向代理设置。
relay:
  # 从上游响应剥离的响应头（解除 iframe 嵌入与脚本限制）。
  stripHeaders:
    - x-frame-options
    - content-security-policy
    - content-security-policy-report-only
    - cross-origin-opener-policy
    - cross-origin-embedder-policy
    - cross-origin-resource-policy
  # 是否注入运行时 shim（改写 fetch/XHR/EventSource/WebSocket 使 SPA 的同源请求继续走代理）。
  injectShim: true
  # 单请求上游超时（毫秒）。
  upstreamTimeoutMs: 60000

# 提示词优化设置。
optimize:
  # null = 自动解析（client 传入的当前模型 → 第一个可用 provider/model）。
  # 也可显式指定：provider: deepseek / model: deepseek-chat。
  provider: null
  model: null
  temperature: 0.4
  maxTokens: 4096
  # off = 关闭思考链，避免推理 token 耗尽 maxTokens（deepseek adapter 支持 off/low/high/max）。
  reasoningEffort: off
  # 优化风格：
  #   preserve   贴着原文语气做小切口改写（默认；结果自然、不套模板）
  #   structured 允许分节结构化重排（适合复杂任务，结果更规整）
  style: preserve
  # 追加给优化器的结构偏好（用户自定义，优先级高于 style）；null = 不加额外约束。
  # 例：structureHint: "输出必须是可直接放进 API 的 JSON，含 schema 说明"
  structureHint: null

  # ── 捕捉内容的二次提取（整理）──
  # null = 沿用上面的 provider/model 自动解析。
  extractProvider: null
  extractModel: null
  # 整理温度低于优化温度：倾向忠实还原而非发挥。
  extractTemperature: 0.2
  extractMaxTokens: 8192

  # ── 与外部 AI 协作（选项二双轮闭环）──
  # 流程：压缩对话上下文 → 第一次优化 → 发送到外部浏览器 → 等待并捕捉回复
  #       → 第二次优化（消化回复）→ 写入输入框（不自动发送）。
  # 等待外部回复的上限（毫秒）。超时不判失败：弹窗会给出「继续等待 / 采用已抓内容」。
  relayTimeoutMs: 120000
  # 上下文压缩读取的对话条数（越大背景越完整，token 消耗越高）。
  contextLimit: 40

# 捕获存档设置。
capture:
  # null = $DSH_HOME/webrelay/captures
  dir: null
  # 面板历史默认展示条数。
  recentLimit: 30

# 专用联动浏览器（CDP）设置。openIn: cdp 的站点在该实例中打开（独立配置目录，
# 首次登录各站点后长期保持登录态，不影响你正在使用的浏览器窗口）。
# 联动浏览器实例表：每个实例 = 独立进程 + 独立调试端口 + 独立配置子目录；
# 同类型浏览器可经 profile（Chrome 账户配置目录名，如 Default / Profile 1，chrome://version 可查）
# 承载多个账户。站点经 sites.<id>.browser: <实例id> 绑定；未绑定的联动站点用默认实例（cdp 段）。
# 示例：
# browsers:
#   chrome-main: { label: Chrome 主号, type: chrome, profile: Default, port: 9222 }
#   edge-work:   { label: Edge 工作号, type: edge, profile: "Profile 1", port: 9223 }
browsers: {}
cdp:
  port: 9222
  # null = 自动探测 Chrome / Edge 安装路径；也可手动指定如 C:/Program Files/Google/Chrome/Application/chrome.exe
  browserPath: null
  startupTimeoutMs: 20000
  # 无头模式（无窗口；自测/服务器用）。日常使用建议 false 以便正常过站点风控。
  headless: false
